name: github-issues
display_name: "GitHub Issues"
auth_type: mixed

connection_fields:
  - name: repo
    type: string
    required: true
    secret: false
    description: "Default repo in owner/repo format"
  - name: auth_mode
    type: string
    required: true
    default: "gh_cli"
    allowed:
      - gh_cli
      - pat
    description: "Authentication mode: gh CLI session or personal access token"
  - name: token
    type: secret
    required: false
    secret: true
    description: "GitHub personal access token. Required for PAT mode"

operations:
  - fetch
  - comment
  - search
